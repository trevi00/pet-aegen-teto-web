# agtt.cloud — SPA + 백엔드 프록시 (외부로 여는 것은 /api/analyze, /api/health 두 경로뿐)

# Cloudflare 뒤에서는 실제 방문자 IP가 CF-Connecting-IP 로 온다
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_key zone=analyze:10m rate=6r/m;
limit_req_status 429;

# www → 대표 주소로 영구 이동 (주소 하나로 통일)
server {
    listen 8080;
    server_name www.agtt.cloud;
    server_tokens off;
    return 301 https://agtt.cloud$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 10m;

    # HSTS: 6개월, 하위 도메인 포함, preload 는 하지 않음 (되돌리기 어려움)
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /api/analyze {
        limit_except POST { deny all; }
        limit_req zone=analyze burst=3 nodelay;
        proxy_pass http://backend:5000/analyze;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass http://backend:5000/health;
    }

    # 그 밖의 /api/* (예: /metrics 우회 시도) 는 전부 막는다
    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
