# agtt.cloud — SPA + 백엔드 프록시
# 외부 경로는 Cloudflare Tunnel 하나뿐. edge 네트워크(172.31.250.0/29, compose 에서 고정)에서 온 요청만 받는다.

# ── 실제 방문자 IP: 터널(edge 네트워크)이 붙인 CF-Connecting-IP 만 신뢰 ──
set_real_ip_from 172.31.250.0/29;
real_ip_header CF-Connecting-IP;

# ── 요청 제한 ──
limit_req_zone  $binary_remote_addr zone=analyze:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=cspreport:1m rate=10r/m;
log_format csp escape=json '{"t":"$time_iso8601","report":"$request_body"}';
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

# ── 느린 연결·거대 헤더 공격 대비 ──
client_header_timeout 10s;
client_body_timeout   20s;
send_timeout          20s;
large_client_header_buffers 4 8k;
client_max_body_size  1m;
server_tokens off;

# CSP 보고 수신용 내부 싱크 (컨테이너 루프백 전용)
server {
    listen 127.0.0.1:8099;
    access_log off;
    location / { return 204; }
}

# 접근 경로 제한은 네트워크로 한다: web 은 edge(터널) 네트워크와 호스트 127.0.0.1:8081 에만 노출.
# (allow/deny 는 real_ip 로 바뀐 방문자 IP 에 적용되므로 쓰지 않는다)
# 모르는 Host 는 응답 없이 끊는다
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

# www → 대표 주소로 영구 이동
server {
    listen 8080;
    server_name www.agtt.cloud;
    return 301 https://agtt.cloud$request_uri;
}

server {
    listen 8080;
    server_name agtt.cloud;
    root /usr/share/nginx/html;
    index index.html;


    limit_conn perip 20;
    keepalive_timeout  30s;   # 기본 nginx.conf 의 http 값과 겹치지 않게 server 에서 덮어쓴다
    keepalive_requests 200;

    # 하위 location 이 add_header 를 써도 아래 보안 헤더를 합쳐서 내보낸다 (nginx >= 1.29.3)
    add_header_inherit merge;
    # HSTS: 6개월, 하위 도메인 포함, preload 는 하지 않음 (되돌리기 어려움)
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /api/analyze {
        limit_except POST { deny all; }
        limit_req zone=analyze burst=3 nodelay;
        limit_conn perip 2;
        client_max_body_size 10m;
        proxy_pass http://backend:5000/analyze;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass http://backend:5000/health;
    }

    # 그 밖의 /api/* (예: /metrics 우회 시도) 는 전부 막는다
    location /api/ {
        return 404;
    }

    # 없는 주소는 진짜 404 (빌드 때 만든 noindex 404.html)
    error_page 404 /404.html;

    # 페이지: 빌드 후처리가 경로마다 dist/<경로>/index.html 을 만든다 (제목·설명·canonical 이 경로별로 다름).
    # 모르는 경로를 index.html 로 떨어뜨리지 않는다 — 전부 200 이면 Google 이 가짜 404 로 본다.
    # HTML 은 요청마다 nonce 주입, 캐시 금지, CSP(Report-Only 단계). sub_filter 는 text/html 에만 걸린다.
    # AdSense 공식 지원 형태 = strict nonce CSP (support.google.com/adsense/answer/16283098)
    location / {
        limit_except GET { deny all; }   # GET(+HEAD)만
        try_files $uri $uri/index.html =404;
        sub_filter_once off;
        sub_filter '<script ' '<script nonce="$request_id" ';
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy-Report-Only "object-src 'none'; script-src 'nonce-$request_id' 'unsafe-inline' 'unsafe-eval' 'strict-dynamic' https: http:; base-uri 'none'; frame-ancestors 'self'; form-action 'self'; report-uri /csp-report" always;
    }

    # CSP 위반 보고: 작게, 드물게, 로그로만
    location = /csp-report {
        limit_except POST { deny all; }
        limit_req zone=cspreport burst=5 nodelay;
        client_max_body_size 16k;
        access_log /dev/stdout csp;
        proxy_pass http://127.0.0.1:8099;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        limit_except GET { deny all; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
